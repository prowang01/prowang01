<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Prosper Wang — Applied AI Systems</title>
  <desc id="hero-desc">Forward Deployed Engineering, AI Product, and Reliability. An engineering workflow from ambiguity to working system to evidence to impact. Build, evaluate, deploy, iterate.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1828" />
      <stop offset="1" stop-color="#070d18" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8df" />
      <stop offset="0.65" stop-color="#3985ad" />
      <stop offset="1" stop-color="#7675b5" />
    </linearGradient>
    <radialGradient id="ambient" cx="85%" cy="15%" r="70%">
      <stop offset="0" stop-color="#193850" stop-opacity="0.42" />
      <stop offset="1" stop-color="#193850" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#92b6cd" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#base)" />
  <rect width="1200" height="340" rx="14" fill="url(#ambient)" />
  <rect x="1" y="1" width="1198" height="338" rx="13" fill="url(#grid)" stroke="#26374b" />
