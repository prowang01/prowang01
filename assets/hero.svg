    <text x="56" y="158" fill="#80eee4" font-size="26" font-weight="600" letter-spacing="3">APPLIED AI SYSTEMS</text>
    <text x="56" y="190" fill="#c3d1df" font-size="18" letter-spacing="0.65">FORWARD DEPLOYED ENGINEERING · AI PRODUCT · RELIABILITY</text>
